# OpenShell policy of the radar sandbox. Edit it, then run case.up() in the notebook (it recreates the sandbox).
version: 1

filesystem_policy:
  include_workdir: false
  read_only: [/usr, /lib, /etc, /proc, /var/log, /dev/urandom, /sandbox]   # system dirs and the agent code
  read_write: [/sandbox/runs, /tmp, /dev/null]                             # results and scratch space only

landlock:
  compatibility: hard_requirement          # fail closed if the kernel cannot enforce the filesystem rules

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:                          # an allowlist: nothing that is not listed is reachable
  nebius_chat:
    name: nebius-token-factory-only
    endpoints:
      - host: api.tokenfactory.nebius.com
        port: 443
        protocol: rest
        enforcement: enforce
        credential_binding:
          provider: radar-nebius           # the Nebius key is injected here and only here
        rules:
          - allow: {method: POST, path: /v1/chat/completions}
          - allow: {method: GET, path: /v1/models}
    binaries:
      - path: /usr/local/bin/python3.12    # only python may open this connection
  tavily_search:
    name: tavily-search-only
    endpoints:
      - host: api.tavily.com
        port: 443
        protocol: rest
        enforcement: enforce
        credential_binding:
          provider: radar-tavily
        rules:
          - allow: {method: POST, path: /search}
    binaries:
      - path: /usr/local/bin/python3.12
